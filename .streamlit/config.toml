[theme]
base = "light"
primaryColor = "#326080"
backgroundColor = "#FFF1E7"
secondaryBackgroundColor = "#FDF7F2"
textColor = "#22384A"
borderColor = "#EFE1D6"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Georgia, Cambria, 'Times New Roman', serif"
baseRadius = "1.25rem"
buttonRadius = "full"
showWidgetBorder = false

[theme.sidebar]
backgroundColor = "#FBEADF"
secondaryBackgroundColor = "#FFF6EF"
borderColor = "#EFE1D6"

[server]
headless = true
